; Clash 自定义转换模板（优化预览版）
; 设计原则：
; 1. 保留在线引用上游规则的方式
; 2. 保留 FINAL -> 国内/DIRECT 的白名单式兜底
; 3. 强制国内 > 区域限定 > 高纯净 > 普通自定义 > 具体服务 > 通用规则
; 4. AI、YouTube 等具体服务必须排在宽泛的 Google/Global 规则之前

; ==================================================
; 1、规则集（按优先级从上到下匹配）
; ==================================================

; 1.1 强制直连：最高优先级
ruleset=自定义规则(强制国内),https://raw.githubusercontent.com/dbPPs/Clash/refs/heads/main/DIRECT.list
ruleset=自定义规则(强制国内),https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/SteamCN/SteamCN.list

; 1.2 区域限定：创建对应 List 后再取消注释
; 注意：区域规则必须放在高纯净、普通自定义和公共服务规则之前
ruleset=日本限定,https://raw.githubusercontent.com/dbPPs/Clash/refs/heads/main/Region-JP.list
;ruleset=美国限定,https://raw.githubusercontent.com/dbPPs/Clash/refs/heads/main/Region-US.list
;ruleset=台湾限定,https://raw.githubusercontent.com/dbPPs/Clash/refs/heads/main/Region-TW.list

; 1.3 自定义高纯净：Claude 全量规则归入高纯净节点
ruleset=自定义规则(高纯净节点),https://raw.githubusercontent.com/dbPPs/Clash/refs/heads/main/Custom-Clean.list
ruleset=自定义规则(高纯净节点),https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Claude/Claude.list

; 1.4 自定义普通代理
ruleset=自定义规则(普通节点),https://raw.githubusercontent.com/dbPPs/Clash/refs/heads/main/Custom-General.list

; 1.5 AI：必须排在宽泛的 Google 规则之前
ruleset=AI,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Gemini/Gemini.list
ruleset=AI,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/OpenAI/OpenAI.list

; 1.6 具体服务
ruleset=Instagram,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Instagram/Instagram.list
ruleset=YouTube,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/YouTube/YouTube.list
ruleset=X[Twitter],https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Twitter/Twitter.list
ruleset=Telegram,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Telegram/Telegram.list
ruleset=Spotify,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Spotify/Spotify.list

; 1.7 Google：搜索与生态合并为同一个策略组
; 仍然保留各自的上游 List，便于上游独立更新
ruleset=Google服务,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/GoogleSearch/GoogleSearch.list
ruleset=Google服务,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Google/Google.list
ruleset=Google服务,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/GoogleEarth/GoogleEarth.list
ruleset=Google服务,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/GoogleFCM/GoogleFCM.list

; 1.8 其余国外
ruleset=其余国外,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Steam/Steam.list
ruleset=其余国外,https://raw.githubusercontent.com/dbPPs/Clash/refs/heads/main/CustomGlobal.list
ruleset=其余国外,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Global/Global.list

; 1.9 保留原有兜底逻辑：未命中流量默认直连
ruleset=国内,[]FINAL


